name: Publish Breizh Reprog Windows

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Build Windows EXE"
    types:
      - completed
    branches:
      - master
permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm install

      - name: Generate Breizh Reprog icons
        run: npm run tauri -- icon public/breizh-reprog-app-icon.svg

      - name: Build and publish Windows installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Breizh Reprog X Ninnin Projet Perf v__VERSION__
          releaseBody: |
            Breizh Reprog X Ninnin Projet Perf Windows installer.
            This release is also used by the in-app automatic updater.
          releaseDraft: false
          prerelease: false
