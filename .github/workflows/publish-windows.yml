name: Publish Breizh Reprog Windows

on:
  workflow_run:
    workflows:
      - "Build Windows EXE"
    types:
      - completed
    branches:
      - master

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: windows-latest

    steps:
      - name: Checkout built commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Download existing installer
        uses: actions/download-artifact@v4
        with:
          name: breizh-reprog-windows-installer
          path: release-assets
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Read version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "VERSION=$version" >> $env:GITHUB_ENV
          $exe = Get-ChildItem -Path release-assets -Filter *.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw "Installer .exe introuvable dans l'artifact." }
          "EXE_PATH=$($exe.FullName)" >> $env:GITHUB_ENV
          Write-Host "Version $version"
          Write-Host "Installer $($exe.FullName)"

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "v$env:VERSION" "$env:EXE_PATH" --repo "${{ github.repository }}" --title "Breizh Reprog X Ninnin Projet Perf v$env:VERSION" --notes "Breizh Reprog X Ninnin Projet Perf Windows installer. Cette release est utilisée par la mise à jour automatique."
