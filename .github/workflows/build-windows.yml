name: Build and Publish Windows EXE

on:
  push:
    branches: ["master"]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.*"
      - "tsconfig.json"
      - "tailwind.config.*"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: breizhreprog-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          cache-all-crates: true

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build Windows installer
        run: npm run tauri build -- --bundles nsis

      - name: Prepare release
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "VERSION=$version" >> $env:GITHUB_ENV
          $exe = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter *.exe -File | Select-Object -First 1
          if (-not $exe) { throw "Installer .exe introuvable." }
          "EXE_PATH=$($exe.FullName)" >> $env:GITHUB_ENV
          Write-Host "Version: $version"
          Write-Host "Installer: $($exe.FullName)"

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v$env:VERSION"
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag "$env:EXE_PATH" --repo "${{ github.repository }}" --title "Breizh Reprog X Ninnin Projet Perf v$env:VERSION" --notes "Breizh Reprog X Ninnin Projet Perf Windows installer. Cette release est utilisée par la mise à jour automatique."
          } else {
            gh release upload $tag "$env:EXE_PATH" --repo "${{ github.repository }}" --clobber
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: breizh-reprog-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 3
