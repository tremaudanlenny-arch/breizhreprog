name: Build Windows EXE

on:
  push:
    branches: ["master"]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.*"
      - "tsconfig.json"
      - "tailwind.config.*"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: breizhreprog-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Tauri application
        run: npm run tauri build

      - name: Read application version
        id: version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building Breizh Reprog v$version"

      - name: Upload NSIS installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Breizh-Reprog-${{ steps.version.outputs.version }}-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

