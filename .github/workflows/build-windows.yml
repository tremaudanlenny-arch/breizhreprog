name: Build & Publish Windows EXE

on:
  push:
    branches: ["master"]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.*"
      - "tsconfig.json"
      - "tailwind.config.*"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: breizhreprog-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24

jobs:
  publish-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install dependencies
        run: npm install --no-audit --no-fund --prefer-offline

      - name: Generate Breizh Reprog icons
        run: npm run tauri -- icon public/breizh-reprog-app-icon.svg

      - name: Build and publish Windows installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Breizh Reprog X Ninnin Projet Perf v__VERSION__
          releaseBody: |
            Breizh Reprog X Ninnin Projet Perf Windows installer.
            This release is also used by the in-app automatic updater.
          releaseDraft: false
          prerelease: false
          args: --bundles nsis
