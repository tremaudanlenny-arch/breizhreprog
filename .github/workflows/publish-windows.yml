name: Publish Breizh Reprog Windows (manual fallback)

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download latest Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: breizh-reprog-windows-installer
          path: release-assets

      - name: Read version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "VERSION=$version" >> $env:GITHUB_ENV
          $exe = Get-ChildItem -Path release-assets -Filter *.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw "Installer .exe introuvable dans l'artifact." }
          "EXE_PATH=$($exe.FullName)" >> $env:GITHUB_ENV

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v$env:VERSION"
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag "$env:EXE_PATH" --repo "${{ github.repository }}" --title "Breizh Reprog X Ninnin Projet Perf v$env:VERSION" --notes "Breizh Reprog X Ninnin Projet Perf Windows installer."
          } else {
            gh release upload $tag "$env:EXE_PATH" --repo "${{ github.repository }}" --clobber
          }
